version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doccraft-api
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app          # hot-reload in dev
      - /tmp/doccraft:/tmp/doccraft
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: doccraft-ui
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    environment:
      - VITE_API_URL=http://backend:8001
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
    restart: unless-stopped
